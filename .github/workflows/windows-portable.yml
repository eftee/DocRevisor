name: DocRevisor Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: docrevisor-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Get original open-source release v0.19.0
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.19.0 --recurse-submodules https://github.com/storytold/pdfcraft.git source
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch original release' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename source identity to DocRevisor
        shell: pwsh
        run: |
          python rebrand.py source
          if ($LASTEXITCODE -ne 0) { throw 'Source rebranding failed' }
      - name: Generate custom application icons
        shell: pwsh
        run: |
          python qa/icons.py source
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
      - name: Fetch the matching translation and font assets
        shell: pwsh
        run: |
          git clone https://github.com/storytold/craft-i18n.git i18n
          git -C i18n checkout 575cfdef63227b14daf173b8cc87928bfdfa325e
          git clone https://github.com/storytold/craft-fonts.git fonts
          git -C fonts checkout b076417b5880bd4154bd22f00695b1d28c6bea83
          git -C fonts lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'Font checkout failed' }
          python qa/rebrand_catalogs.py i18n
          if ($LASTEXITCODE -ne 0) { throw 'Localization migration failed' }
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile Windows desktop app and CLI
        shell: pwsh
        working-directory: source
        env:
          DOCREVISOR_REQUIRE_WINRES: '1'
          CRAFT_FONTS_DIR: ${{ github.workspace }}/fonts
          CRAFT_FONTS_REQUIRED: '1'
          CRAFT_I18N_DIR: ${{ github.workspace }}/i18n
          CRAFT_I18N_REQUIRED: '1'
        run: |
          cargo build --release -p docrevisor -p docrevisor-cli
          if ($LASTEXITCODE -ne 0) { throw 'Cargo compilation failed' }
      - name: Rust engine regression tests
        shell: pwsh
        working-directory: source
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/fonts
          CRAFT_I18N_DIR: ${{ github.workspace }}/i18n
        run: |
          cargo test --release -p docrevisor-engine --lib
          if ($LASTEXITCODE -ne 0) { throw 'Rust engine unit tests failed' }
      - name: PDF regression smoke tests
        shell: pwsh
        run: |
          python qa/smoke.py source/target/release/docrevisor-cli.exe
          if ($LASTEXITCODE -ne 0) { throw 'PDF regression tests failed' }
      - name: Assemble portable package with OCR and licenses
        shell: pwsh
        run: |
          $url = 'https://github.com/storytold/pdfcraft/releases/download/v0.19.0/pdfcraft-0.19.0-windows-x64-portable.zip'
          Invoke-WebRequest -Uri $url -OutFile 'upstream.zip'
          Expand-Archive -Path 'upstream.zip' -DestinationPath 'upstream' -Force
          $original = Get-ChildItem upstream -Directory | Select-Object -First 1
          if (!$original) { throw 'Original portable distribution missing' }
          New-Item -ItemType Directory -Force dist/DocRevisor | Out-Null
          Copy-Item source/target/release/docrevisor.exe dist/DocRevisor/DocRevisor.exe
          Copy-Item source/target/release/docrevisor-cli.exe dist/DocRevisor/DocRevisor-cli.exe
          foreach ($item in Get-ChildItem $original.FullName) {
            if ($item.Name -in @('pdfcraft.exe','pdfcraft-cli.exe','README.md','portable.txt')) { continue }
            Copy-Item -Path $item.FullName -Destination 'dist/DocRevisor' -Recurse -Force
          }
          Set-Content -Path dist/DocRevisor/portable.txt -Value 'DocRevisor portable mode' -Encoding ascii
          Set-Content -Path dist/DocRevisor/README.md -Value 'DocRevisor 0.19.0 - independent derivative of storytold/pdfcraft. Original notices and licenses are included. This app is unsigned.' -Encoding utf8
          if (!(Test-Path dist/DocRevisor/models/text-recognition.onnx)) { throw 'OCR models missing' }
          Compress-Archive -Path dist/DocRevisor -DestinationPath dist/DocRevisor-0.19.0-windows-x64-portable.zip
      - name: Check executable identity
        shell: pwsh
        run: |
          $gui = 'dist/DocRevisor/DocRevisor.exe'
          if (!(Test-Path $gui)) { throw 'GUI executable missing' }
          $info = (Get-Item $gui).VersionInfo
          Write-Host "Product name: $($info.ProductName)"
          if ($info.ProductName -ne 'DocRevisor') { throw "Unexpected product name: $($info.ProductName)" }
          Get-FileHash $gui -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: DocRevisor-Windows-Portable
          path: dist/DocRevisor-0.19.0-windows-x64-portable.zip
          if-no-files-found: error
